name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Do not let two reruns upload/publish the same tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate tests, frontend and release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release versions and tag
        run: node scripts/verify-release.mjs

      - name: Run unit tests
        run: npm run test:mocks

      - name: Check frontend build
        run: npm run build

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          # GitHub-hosted ARM Linux runner (free for public repos
          # since 2024). Native build — no cross-compile of webkit2gtk.
          - platform: ubuntu-22.04-arm
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    env:
      # GitHub-hosted runners occasionally hit crates.io HTTP/2 stream
      # resets while downloading large dependency graphs. Cargo retries plus
      # HTTP/1.1 transport make release builds less flaky across the matrix.
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install protoc (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install protobuf

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          # xdg-utils provides /usr/bin/xdg-open, which Tauri's
          # AppImage bundler embeds into the produced AppImage.
          # Pre-installed on the x86_64 runner image but NOT on
          # the ARM64 image — list it explicitly so both arches
          # bundle cleanly regardless of future image drift.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler xdg-utils

      # The repo ships pre-downloaded PDFium binaries under
      # src-tauri/pdfium/ for every supported architecture
      # (libpdfium.so = Linux x86_64, libpdfium-arm64.so = Linux aarch64,
      # libpdfium.dylib = macOS arm64, pdfium.dll = Windows).
      # For architectures whose bundled filename must
      # stay `libpdfium.*`, swap the matching binary into place before cargo
      # runs. We do NOT pull from bblanchon/pdfium-binaries during CI — that
      # download has historically failed often enough that committing the
      # binaries is the maintenance-friendly path.
      - name: Verify PDFium binary checksums
        if: matrix.platform != 'windows-latest'
        run: shasum -a 256 -c src-tauri/pdfium/SHA256SUMS

      # rust_target is empty for both Ubuntu rows, so platform is the
      # only stable discriminator for the Linux ARM swap.
      - name: Use ARM64 pdfium binary (Ubuntu ARM only)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          cp src-tauri/pdfium/libpdfium-arm64.so src-tauri/pdfium/libpdfium.so
          file src-tauri/pdfium/libpdfium.so

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build

      - name: Configure optional Apple signing
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const signing = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY'];
          const notarization = ['APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'];
          const configured = (keys) => {
            const count = keys.filter((key) => process.env[key]).length;
            if (count !== 0 && count !== keys.length) throw new Error(`Incomplete Apple configuration: set all of ${keys.join(', ')} or none`);
            return count === keys.length;
          };
          const signed = configured(signing);
          const notarized = configured(notarization);
          if (notarized && !signed) throw new Error('Notarization requires signing credentials');
          for (const key of [...(signed ? signing : []), ...(notarized ? notarization : [])]) {
            const delimiter = `ENV_${randomUUID()}`;
            appendFileSync(process.env.GITHUB_ENV, `${key}<<${delimiter}\n${process.env[key]}\n${delimiter}\n`);
          }
          const status = signed ? (notarized ? 'Developer ID signing and notarization configured.' : 'Developer ID signing configured; notarization is not configured.') : 'No Developer ID signing or notarization configured. This macOS build is intended for manual testing.';
          console.log(status);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${status}\n`);
          NODE

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Build only. The publish job owns the release, after every
          # platform and the extension have completed successfully.
          args: ${{ matrix.args }}

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          .github/scripts/package-windows-portable.ps1 -Version $version

      - name: Verify required platform bundles
        run: node scripts/verify-release.mjs --platform "${{ matrix.platform }}"

      # Both manual and tagged builds retain independently downloadable
      # artifacts. Manual runs stop here and never create a Release.
      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          # Glob covers both targeted (e.g.
          # target/aarch64-apple-darwin/release/...) and default
          # (target/release/...) build paths.
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            dist-portable/*.zip
          if-no-files-found: error
          retention-days: 14

  package-extension:
    name: Package browser extension
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync extension manifest version and zip
        run: |
          # Pull version from package.json so we have a single source of
          # truth. Chrome's manifest requires numeric-only version
          # (e.g. 0.3.5); version_name preserves any prerelease suffix.
          APP_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const p = 'extension/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf-8'));
            m.version = '${APP_VERSION}'.split('-')[0];
            m.version_name = '${APP_VERSION}';
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "
          mkdir -p dist-extension
          (cd extension && zip -r "../dist-extension/llm-wiki-extension-${APP_VERSION}.zip" . -x "*.DS_Store")
          ls -la dist-extension

      - name: Upload extension as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: dist-extension/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify and publish complete release
    needs: [build, package-extension]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all platform and extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Validate complete asset set and generate SHA256 checksums
        run: node scripts/verify-release.mjs --collect release-artifacts --output dist-release

      - name: Create or resume draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json', 'utf8')).isDraft) throw new Error('Refusing to overwrite an already published release');"
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
            notes=(--generate-notes)
            if [[ -f "release-notes/$RELEASE_TAG.md" ]]; then notes=(--notes-file "release-notes/$RELEASE_TAG.md"); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" --title "LLM Wiki × Jev $RELEASE_TAG" "${notes[@]}"
          fi

      - name: Upload assets to draft
        run: gh release upload "$RELEASE_TAG" dist-release/* --clobber

      - name: Download uploaded assets and verify checksums
        run: |
          gh release download "$RELEASE_TAG" --dir release-downloads
          node scripts/verify-release.mjs --verify-download release-downloads --manifest dist-release/SHA256SUMS

      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --draft=false
